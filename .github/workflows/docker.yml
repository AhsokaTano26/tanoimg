name: Docker Hub

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: go test ./...
      - name: Test migration client
        run: python3 -m unittest discover -s scripts -p 'test_migrate_easyimg.py'

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ format('{0}/tanoimg', secrets.DOCKERHUB_USERNAME || 'tanoimg-ci') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate publication configuration
        if: github.event_name != 'pull_request'
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$USERNAME" || { echo 'Configure secret DOCKERHUB_USERNAME'; exit 1; }
          test -n "$TOKEN" || { echo 'Configure secret DOCKERHUB_TOKEN'; exit 1; }
          [[ "$USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'DOCKERHUB_USERNAME must be a lowercase Docker Hub username'; exit 1; }
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Resolve application version
        id: version
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$TAG_VERSION"
          else
            VERSION="$(awk '$1 == "VERSION" && $2 == "?=" { print $3; exit }' Makefile)"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid application version'; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
