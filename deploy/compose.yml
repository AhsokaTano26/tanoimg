services:
  tanoimg:
    image: ${TANOIMG_IMAGE:?Set TANOIMG_IMAGE to your Docker Hub image and tag}
    ports:
      - "${TANOIMG_BIND:-127.0.0.1}:${TANOIMG_PORT:-3000}:3000"
    environment:
      TANOIMG_ADMIN_PASSWORD: ${TANOIMG_ADMIN_PASSWORD:-}
      TANOIMG_PUBLIC_URL: ${TANOIMG_PUBLIC_URL:-}
      TANOIMG_TRUST_PROXY: ${TANOIMG_TRUST_PROXY:-false}
    volumes:
      - tanoimg_data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tanoimg_data:
